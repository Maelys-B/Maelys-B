<svg xmlns="http://www.w3.org/2000/svg" width="800" height="64" viewBox="0 0 800 64">
<defs>
<pattern id="st" width="40" height="64" patternUnits="userSpaceOnUse">
<rect width="40" height="64" fill="#ffd400"/>
<polygon points="0,0 20,0 -12,64 -32,64" fill="#111"/>
<polygon points="40,0 60,0 28,64 8,64" fill="#111"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="0.8s" repeatCount="indefinite"/>
</pattern>
</defs>
<rect width="800" height="64" fill="url(#st)" rx="6"/>
<rect x="130" y="10" width="540" height="44" fill="#111" rx="4"/>
<text x="400" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#ffd400">🚧 PROFIL EN CONSTRUCTION DEPUIS TOUJOURS 🚧
<animate attributeName="fill" values="#ffd400;#ffd400;#ff3b3b;#ff3b3b" dur="1s" calcMode="discrete" repeatCount="indefinite"/></text>
</svg>